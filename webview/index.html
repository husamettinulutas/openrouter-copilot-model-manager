<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}};">
  <title>OpenRouter Copilot Model Manager</title>
  <link rel="stylesheet" href="{{variablesCssUri}}">
  <link rel="stylesheet" href="{{mainCssUri}}">
  <link rel="stylesheet" href="{{cardsCssUri}}">
  <link rel="stylesheet" href="{{animationsCssUri}}">
</head>
<body>
  <!-- Shared SVG gradient for rings / meters (stop colours come from CSS so they follow the theme) -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="grad-brand" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" class="stop-a"></stop>
        <stop offset="1" class="stop-b"></stop>
      </linearGradient>
    </defs>
  </svg>

  <div class="app" id="app">
    <div class="aurora" aria-hidden="true"></div>

    <!-- Top bar. Sidebar: brand + actions on one row, tabs below. Panel: brand · tabs · actions on one row. -->
    <header class="topbar">
      <div class="brand" aria-hidden="true">
        <span class="brand-mark">
          <!-- Same glyph as resources/icon.svg and resources/activitybar.svg -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 5h11a3 3 0 0 1 3 3v10"/>
            <rect x="2" y="9" width="14" height="13" rx="3"/>
            <path d="M9 10.7Q10 14.5 13.8 15.5Q10 16.5 9 20.3Q8 16.5 4.2 15.5Q8 14.5 9 10.7Z" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-eyebrow">OpenRouter</span>
          <span class="brand-title">Copilot Model Manager</span>
        </span>
      </div>
      <span class="topbar-rule" aria-hidden="true"></span>

      <div class="segmented" role="tablist" aria-label="Views" id="tabs">
        <span class="segmented-thumb" aria-hidden="true"></span>
        <button class="seg-tab active" id="tab-browse" role="tab" aria-selected="true" aria-controls="tab-content-browse" tabindex="0">
          <span class="ico" data-icon="layers"></span><span class="seg-label">Browse</span>
        </button>
        <button class="seg-tab" id="tab-active" role="tab" aria-selected="false" aria-controls="tab-content-active" tabindex="-1">
          <span class="ico" data-icon="zap"></span><span class="seg-label">Active</span>
          <span class="seg-count num" id="active-tab-count">0</span>
        </button>
      </div>

      <div class="toolbar">
        <button class="icon-btn" id="apikey-btn" title="Set OpenRouter API key" aria-label="Set OpenRouter API key">
          <span class="ico" data-icon="key"></span><span class="attn-dot" aria-hidden="true"></span>
        </button>
        <button class="icon-btn" id="sync-btn" title="Sync models from OpenRouter" aria-label="Sync models from OpenRouter">
          <span class="ico" data-icon="refresh"></span>
        </button>
      </div>
    </header>

    <!-- API key banner (shown when no key is set) -->
    <div class="key-banner" id="apikey-banner" role="region" aria-label="API key required" style="display:none;">
      <span class="key-banner-icon"><span class="ico" data-icon="key"></span></span>
      <span class="key-banner-text"><strong>API key not set.</strong> <span class="key-banner-more">Add your OpenRouter key to browse and enable models.</span></span>
      <button class="btn btn-primary btn-sm" id="apikey-banner-btn">Set key</button>
    </div>

    <main class="views">
      <!-- TAB 1: BROWSE -->
      <section class="tab-content active" id="tab-content-browse" role="tabpanel" aria-labelledby="tab-browse">
        <div class="filters" id="filters">
          <div class="search">
            <span class="search-icon ico" data-icon="search"></span>
            <input type="text" class="search-input" id="search-input" placeholder="Search models, providers, IDs" aria-label="Search models" autocomplete="off" spellcheck="false" />
            <kbd class="search-kbd" aria-hidden="true">/</kbd>
            <button class="search-clear" id="search-clear" title="Clear search" aria-label="Clear search"><span class="ico" data-icon="x"></span></button>
          </div>

          <div class="chip-row" role="group" aria-label="Capability filters">
            <button class="chip" data-hue="vision" id="filter-vision" aria-pressed="false"><span class="ico" data-icon="eye"></span><span>Vision</span></button>
            <button class="chip" data-hue="tools" id="filter-tools" aria-pressed="false"><span class="ico" data-icon="wrench"></span><span>Tools</span></button>
            <button class="chip" data-hue="free" id="filter-free" aria-pressed="false"><span class="ico" data-icon="gift"></span><span>Free</span></button>
            <button class="chip" data-hue="reason" id="filter-reasoning" aria-pressed="false"><span class="ico" data-icon="bulb"></span><span>Reasoning</span></button>
          </div>

          <div class="select-row">
            <div class="provider-dropdown">
              <button class="select-btn" id="provider-filter-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="provider-menu" title="Filter by provider">
                <span class="ico" data-icon="building"></span>
                <span class="select-btn-label" id="provider-label">All providers</span>
                <span class="ico chev" data-icon="chevronDown"></span>
              </button>
              <div class="provider-menu" id="provider-menu" role="listbox" aria-label="Provider"></div>
            </div>
            <div class="select-wrap" title="Sort order">
              <span class="ico" data-icon="sort"></span>
              <select class="sort-select" id="sort-select" aria-label="Sort models">
                <option value="name-asc">Name A–Z</option>
                <option value="price-asc">Cheapest input</option>
                <option value="price-desc">Priciest input</option>
                <option value="context-desc">Largest context</option>
                <option value="newest">Newest</option>
              </select>
              <span class="ico chev" data-icon="chevronDown"></span>
            </div>
            <div class="view-toggle" role="group" aria-label="Layout">
              <button class="view-btn" id="view-cards" data-view="cards" aria-pressed="false" title="Card layout" aria-label="Card layout"><span class="ico" data-icon="grid"></span></button>
              <button class="view-btn" id="view-table" data-view="table" aria-pressed="true" title="Table layout" aria-label="Table layout"><span class="ico" data-icon="list"></span></button>
            </div>
          </div>
        </div>

        <div class="stats-bar">
          <span class="stats-text" aria-live="polite">Showing <b class="num" id="stats-filtered">0</b> of <b class="num" id="stats-count">0</b> models</span>
          <button class="link-btn" id="stats-clear" hidden>Clear filters</button>
        </div>

        <div class="model-list-container" id="model-list-container">
          <div class="list-head" id="list-head">
            <span class="lh-cell lh-model"><button class="lh-btn" data-sort="name-asc" aria-sort="ascending" aria-label="Model, sort by name A to Z">Model<span class="lh-arrow" aria-hidden="true"></span></button></span>
            <span class="lh-cell lh-caps">Capabilities</span>
            <span class="lh-cell lh-num lh-in"><button class="lh-btn" data-sort="price-asc" aria-sort="none" aria-label="Input price per million tokens, sort cheapest first">Input $/M<span class="lh-arrow" aria-hidden="true"></span></button></span>
            <span class="lh-cell lh-num lh-out">Output $/M</span>
            <span class="lh-cell lh-num lh-ctx"><button class="lh-btn" data-sort="context-desc" aria-sort="none" aria-label="Context window, sort largest first">Context<span class="lh-arrow" aria-hidden="true"></span></button></span>
            <span class="lh-cell lh-num lh-max">Max out</span>
            <span class="lh-cell lh-act"><span class="sr-only">Actions</span></span>
          </div>
          <div class="model-list" id="model-list"></div>
        </div>
      </section>

      <!-- TAB 2: ACTIVE IN COPILOT -->
      <section class="tab-content" id="tab-content-active" role="tabpanel" aria-labelledby="tab-active">
        <div class="active-summary" id="active-summary"></div>
        <div class="active-list" id="active-models-list"></div>
      </section>
    </main>

    <!-- Draft tray: models selected but not yet applied -->
    <section class="tray" id="bottom-panel" aria-label="Selected models">
      <div class="tray-head">
        <button class="tray-toggle" id="bottom-panel-toggle" aria-expanded="false" aria-controls="bottom-panel-body">
          <span class="tray-count num" id="selected-count">0</span>
          <span class="tray-label">
            <span class="tray-title" id="tray-title">No models selected</span>
            <span class="tray-names" id="tray-names">Pick models with Select</span>
          </span>
          <span class="ico tray-chev" data-icon="chevronUp"></span>
        </button>
        <button class="btn btn-primary btn-apply" id="apply-btn" disabled aria-keyshortcuts="Control+Enter" title="Apply selected models to Copilot (Ctrl+Enter)">
          <span class="ico" data-icon="sparkle"></span><span class="apply-label">Apply to Copilot</span><kbd class="apply-kbd" id="apply-kbd" aria-hidden="true">Ctrl ↵</kbd>
        </button>
      </div>
      <div class="tray-body" id="bottom-panel-body">
        <div class="tray-body-inner">
          <ul class="draft-list" id="selected-model-list"></ul>
        </div>
      </div>
    </section>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading-overlay" role="status" aria-live="polite">
      <div class="loading-card">
        <span class="spinner" aria-hidden="true"></span>
        <span class="loading-text">Fetching models from OpenRouter…</span>
      </div>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>

    <!-- Toasts -->
    <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>
  </div>

  <script src="{{vscodeApiJsUri}}"></script>
  <script src="{{filtersJsUri}}"></script>
  <script src="{{appJsUri}}"></script>
</body>
</html>
