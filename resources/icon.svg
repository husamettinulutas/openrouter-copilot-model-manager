<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="bolt" x1="44" y1="20" x2="84" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="black" fill-opacity="0.06"/>

  <!-- Routing network nodes and links -->
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <line x1="26" y1="30" x2="52" y2="52"/>
    <line x1="26" y1="98" x2="50" y2="78"/>
    <line x1="102" y1="30" x2="78" y2="52"/>
    <line x1="102" y1="98" x2="80" y2="78"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="26" cy="30" r="7" fill-opacity="0.9"/>
    <circle cx="26" cy="98" r="7" fill-opacity="0.9"/>
    <circle cx="102" cy="30" r="7" fill-opacity="0.9"/>
    <circle cx="102" cy="98" r="7" fill-opacity="0.9"/>
  </g>

  <!-- Central lightning bolt -->
  <path filter="url(#soft)" d="M70 22 L44 68 H60 L56 106 L86 58 H68 L74 22 Z"
        fill="url(#bolt)" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="round"/>
</svg>
