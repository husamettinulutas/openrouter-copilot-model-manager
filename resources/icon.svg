<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="4" y1="4" x2="124" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7E55F0"/>
      <stop offset="0.55" stop-color="#3F7EEA"/>
      <stop offset="1" stop-color="#00BBD5"/>
    </linearGradient>
    <radialGradient id="bloom" cx="30" cy="22" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3D9FF" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#C9A6FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C9A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hi" x1="0" y1="4" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="9" x2="0" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.9" flood-color="#1B0F55" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- tile: violet-to-cyan diagonal, aurora bloom, top-lit highlight, 20% outline -->
  <rect x="4" y="4" width="120" height="120" rx="26.5" fill="url(#tile)"/>
  <rect x="4" y="4" width="120" height="120" rx="26.5" fill="url(#bloom)"/>
  <rect x="5" y="5" width="118" height="118" rx="25.5" stroke="url(#hi)" stroke-width="1"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="26" stroke="#000" stroke-opacity="0.2" stroke-width="1"/>

  <!-- glyph: stacked model cards + four-point sparkle (24-unit grid, 2-unit strokes) -->
  <g transform="translate(22.6 13.2) scale(3.8)" filter="url(#lift)" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 5H17a3 3 0 0 1 3 3V18" stroke-opacity="0.72"/>
    <rect x="2" y="9" width="14" height="13" rx="3.2" fill="url(#glass)"/>
    <path d="M9 10.7Q10 14.5 13.8 15.5Q10 16.5 9 20.3Q8 16.5 4.2 15.5Q8 14.5 9 10.7Z" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
